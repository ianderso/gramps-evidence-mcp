name: Bug report
description: A tool returned something wrong, wrote something wrong, failed, or the server would not start.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never paste `GRAMPS_MCP_PASSWORD`, a `.env` file, or your Gramps Web address if you would rather keep it private. Your tree holds living people: replace real names, dates and places in any tool call or result with made-up ones before submitting.
        A security problem goes to [private vulnerability reporting](https://github.com/ianderso/gramps-evidence-mcp/security/advisories/new), not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you asked for, what came back or was written, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: tool-call
    attributes:
      label: Tool call
      description: The tool, its arguments, and the result it returned, with personal details replaced.
      render: json
  - type: input
    id: version
    attributes:
      label: Version
      description: The release, or the commit if you run from a clone (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: input
    id: gramps-web
    attributes:
      label: gramps-webapi version
      description: Shown at `/api/metadata/` on your instance, under `gramps_webapi`.
      placeholder: "3.21.1"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude Desktop
        - Claude Code
        - claude.ai custom connector (HTTP transport)
        - Other (say which above)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13"
  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: The server logs to stderr, which your MCP client usually keeps. It holds ids and handles, not record contents. Paste the lines around the failure.
      render: text

name: CI

on:
  # Pushes to main, and every pull request. A push to a pull request's
  # branch is covered by the pull_request event; triggering on it as well
  # would run every job twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions are pinned to commits, with the version in a comment; Dependabot
# updates both. Checkout keeps no credential: no job pushes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      # --locked fails the run if uv.lock no longer matches pyproject.toml,
      # rather than quietly resolving something different from what was
      # tested locally.
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # People run MCP servers from desktop clients, so the platforms
          # those run on are tested too, at one Python version each.
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      # Every test runs against an in-memory fake of gramps-webapi; a guard
      # in tests/conftest.py fails any test that opens a real connection. No
      # Gramps Web instance or credentials are needed.
      - run: uv run pytest

  live:
    # The fake the test job runs against is only as right as our reading of
    # the server. This runs the tools, every PITFALLS claim, and the fake
    # itself against real gramps-webapi releases: the oldest supported, the
    # newest, and 3.22.3, the last to store a key a write carries that the
    # object's class lacks (PITFALLS 18 and 24 differ from 3.23 on), which
    # trees written before then can still hold. tests/live/server-*.txt pins
    # each one's whole dependency set.
    name: Live (gramps-webapi ${{ matrix.webapi }})
    # Pinned: the server compiles against these system libraries, and a new
    # Ubuntu can rename them.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        webapi: ["3.21.1", "3.22.3", "3.23.1"]
    env:
      # Fails the job if the server's settings do not arrive, rather than
      # skipping every test and passing.
      GRAMPS_LIVE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      # What gramps-webapi's own Dockerfile.base installs for PyICU, PyGObject
      # and pycairo.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libicu-dev pkg-config libcairo2-dev \
            libgirepository1.0-dev gir1.2-gtk-3.0
      # Installs the server from PyPI, starts it on loopback with an empty
      # tree, and prints the GRAMPS_LIVE_* settings the suite reads.
      - run: tests/live/start_server.sh "${{ matrix.webapi }}" 5555 "$RUNNER_TEMP/gramps" >> "$GITHUB_ENV"
      - run: uv sync --locked --extra dev
      - run: uv run pytest tests/live
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/gramps/server.log" || true

  lowest:
    # The declared minimum versions are a promise; this keeps them honest.
    name: Test at the lowest supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
      - run: uv venv
      - run: uv pip install --resolution lowest-direct -e ".[dev]"
      - run: .venv/bin/python -m pytest

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
      - run: uv build
      - run: uvx twine check --strict dist/*
